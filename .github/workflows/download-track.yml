name: Download Track

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video URL'
        required: true
        type: string
      category:
        description: 'Category / Playlist name'
        required: true
        default: 'Geral'
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write Firebase service account
        run: |
          mkdir -p automation/credentials
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > automation/credentials/firebase-sa.json

      - name: Install dependencies
        run: npm ci

      - name: Write YouTube cookies
        if: env.YOUTUBE_COOKIES != ''
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: echo "$YOUTUBE_COOKIES" > cookies.txt

      - name: Download and ingest track
        env:
          TRACK_URL: ${{ github.event.inputs.url }}
          TRACK_CATEGORY: ${{ github.event.inputs.category }}
        run: npx tsx scripts/download-and-ingest.ts

      - name: Build and deploy to Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: automation/credentials/firebase-sa.json
        run: bash scripts/deploy-hosting.sh

      - name: Commit and push changes
        env:
          COMMIT_CATEGORY: ${{ github.event.inputs.category }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/ covers/
          git commit -m "chore: add track $COMMIT_CATEGORY - $(date +%Y%m%d-%H%M)" || echo "No new files to commit"
          git push
